name: PHP Backend Tests 🐘

# Backend-Tests (TICKET-038) — laeuft nur wenn website/ oder die Tests selbst
# angefasst werden. Plugin-only-PRs sparen sich den MariaDB-Spin-up.

on:
  push:
    branches:
      - master
      - main
      - Minewache
    paths:
      - 'website/**'
      - '.github/workflows/php-tests.yaml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/php-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit on MariaDB
    runs-on: ubuntu-24.04

    # Service-Container: GitHub haengt das an einen internen Docker-Netzwerk
    # an und stellt sicher, dass es vor dem Job laeuft.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: mw_aufnahme_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          tools: composer
          coverage: none

      - name: Composer install
        working-directory: website
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -ptestroot --silent; then
              echo "MariaDB ready"; exit 0
            fi
            echo "waiting for MariaDB ($i/30)..."
            sleep 2
          done
          echo "MariaDB did not come up in time" >&2
          exit 1

      - name: Run PHPUnit
        working-directory: website
        env:
          MW_TEST_DB_HOST: 127.0.0.1
          MW_TEST_DB_PORT: 3307
          MW_TEST_DB_USER: root
          MW_TEST_DB_PASS: testroot
          MW_TEST_DB_NAME: mw_aufnahme_test
        run: vendor/bin/phpunit --testdox --colors=always
