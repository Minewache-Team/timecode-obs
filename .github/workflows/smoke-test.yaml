name: E2E Smoke Test 🚬

# End-to-End-Smoke-Test (TICKET-039): wirklicher HTTP-Vertrag plugin↔server.
# Laeuft wenn entweder website/ oder die scripts/ angefasst werden.

on:
  push:
    branches:
      - master
      - main
      - Minewache
    paths:
      - 'website/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yaml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: HTTP-Contract Smoke
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: mw_aufnahme_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MW_TEST_DB_HOST: 127.0.0.1
      MW_TEST_DB_PORT: '3307'
      MW_TEST_DB_USER: root
      MW_TEST_DB_PASS: testroot
      MW_TEST_DB_NAME: mw_aufnahme_test
      BASE_URL: http://127.0.0.1:8123
      API_KEY: test_api_key_12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -ptestroot --silent; then
              echo "MariaDB ready"; exit 0
            fi
            echo "waiting for MariaDB ($i/30)..."
            sleep 2
          done
          echo "MariaDB did not come up in time" >&2
          exit 1

      - name: Apply DB schema
        run: php scripts/mw-smoke-helper.php install

      - name: Write real config.php (test creds) so php -S can serve api.php
        # api.php requires website/includes/config.php (gitignored in prod).
        # We materialize it here pointing at the test DB so the dev server
        # can serve real HTTP requests.
        run: |
          cat > website/includes/config.php <<'EOF'
          <?php
          define('DB_HOST', '127.0.0.1');
          define('DB_PORT', 3307);
          define('DB_USER', 'root');
          define('DB_PASS', 'testroot');
          define('DB_NAME', 'mw_aufnahme_test');
          define('DB_CHARSET', 'utf8mb4');
          define('API_KEY', 'test_api_key_12345');
          define('DASHBOARD_PASSWORD', 'test_pw');
          define('HEARTBEAT_TIMEOUT', 90);
          define('SSE_INTERVAL', 2);
          define('MAX_NAME_LENGTH', 100);
          EOF

      - name: Start PHP dev server
        run: |
          php -S 127.0.0.1:8123 -t website/ > php-server.log 2>&1 &
          echo $! > php-server.pid

      - name: Wait for HTTP server
        run: |
          for i in {1..20}; do
            if curl -fsS "${BASE_URL}/api.php?action=status" > /dev/null 2>&1; then
              echo "Server ready"; exit 0
            fi
            echo "waiting for php -S ($i/20)..."
            sleep 1
          done
          cat php-server.log
          exit 1

      - name: Run smoke test (bash)
        run: bash scripts/mw-smoke-test.sh

      - name: Dump server log on failure
        if: failure()
        run: cat php-server.log

      - name: Stop PHP dev server
        if: always()
        run: kill "$(cat php-server.pid)" || true
