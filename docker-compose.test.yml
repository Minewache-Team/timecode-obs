# MW Aufnahme — Test-Datenbank fuer lokales Dev + CI (TICKET-038/039).
#
# Start:
#   docker compose -f docker-compose.test.yml up -d
#
# Anhalten + Volumes loeschen (saubere DB beim naechsten Start):
#   docker compose -f docker-compose.test.yml down -v
#
# Default-Port ist 3307 — bewusst NICHT 3306, damit eine lokal laufende
# Production-MySQL/MariaDB nicht versehentlich getroffen wird.
# config-test.php greift via MW_TEST_DB_HOST / MW_TEST_DB_PORT (siehe README).

services:
  db:
    image: mariadb:11
    container_name: mw-test-db
    environment:
      MARIADB_ROOT_PASSWORD: testroot
      MARIADB_DATABASE: mw_aufnahme_test
    ports:
      - "127.0.0.1:3307:3306"
    # Healthcheck damit `docker compose up --wait` sauber blockt
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 20
    # Kein named volume — Test-DB ist absichtlich ephemer. `docker compose
    # down` raeumt alles ab, naechster `up` startet auf jungfraeulichem Schema.
    tmpfs:
      - /var/lib/mysql
